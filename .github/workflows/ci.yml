name: ci

on:
  push:
  pull_request:
  # Release PRs are opened with GITHUB_TOKEN, which does not trigger push or
  # pull_request runs; release.yml dispatches this workflow on their branch.
  workflow_dispatch:
  # release.yml runs the full suite on the exact release commit before any
  # image is pushed.
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out and test
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    environment: linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.15
      - run: bun i --frozen-lockfile
      - run: bun run format:check

  linting:
    runs-on: ubuntu-latest
    environment: linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.15
      - run: bun i --frozen-lockfile
      - run: bun run lint

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check release version files agree
        run: |
          manifest=$(jq -r '."."' .release-please-manifest.json)
          package=$(jq -r .version package.json)
          if [ "$manifest" != "$package" ]; then
            echo "::error::.release-please-manifest.json ($manifest) and package.json ($package) disagree"
            exit 1
          fi
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ubuntu-latest
    environment: linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.15
      - run: bun i --frozen-lockfile
      - name: Run unit + integration tests
        run: bun run test
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: test
    environment: linting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.15
      - run: bun i --frozen-lockfile
      - name: Build agent bundle
        run: cd apps/agent && bun run build
      - name: Install Playwright browsers
        run: cd apps/website && bunx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd apps/website && bun run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/website/playwright-report/
          retention-days: 14
          if-no-files-found: warn

  # Builds all four images (they share the dependency-install layers) and runs
  # the same smoke test that gates release publication.
  test-docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: build
        run: |
          docker build -t mon-ci/website -f apps/website/Dockerfile .
          docker build -t mon-ci/agent -f apps/agent/Dockerfile .
          docker build -t mon-ci/docs -f apps/docs/Dockerfile .
          docker build -t mon-ci/migrator -f packages/db/Dockerfile .
      - name: smoke test
        env:
          WEBSITE_IMAGE: mon-ci/website
          AGENT_IMAGE: mon-ci/agent
          DOCS_IMAGE: mon-ci/docs
          MIGRATOR_IMAGE: mon-ci/migrator
        run: .github/scripts/smoke-test-images.sh amd64
